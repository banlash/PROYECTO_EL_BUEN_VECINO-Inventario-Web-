<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:view contentType="text/html">
<h:head>
    <title>Inventario - El Buen Vecino</title>
    <!-- Integración de Bootstrap (Sección 3.1 del informe) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</h:head>
<h:body class="bg-light">
    <!-- Navbar Corporativo -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">El Buen Vecino - Inventario</span>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Formulario de Registro JSF -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">Nuevo Producto</div>
                    <div class="card-body">
                        <h:form>
                            <div class="mb-3">
                                <label class="form-label">Nombre del Producto:</label>
                                <h:inputText value="#{productoBean.nombre}" class="form-control" required="true" />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Precio (S/):</label>
                                <h:inputText value="#{productoBean.precio}" class="form-control" required="true" />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Stock Actual:</label>
                                <h:inputText value="#{productoBean.stock}" class="form-control" required="true" />
                            </div>
                            <h:commandButton value="Guardar Producto" action="#{productoBean.guardar}" class="btn btn-success w-100" />
                        </h:form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Datos Dinámica JSF -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">Lista de Productos Registrados</div>
                    <div class="card-body">
                        <h:dataTable value="#{productoBean.listaProductos}" var="prod" class="table table-striped table-hover mt-2">
                            <h:column>
                                <f:facet name="header">Nombre</f:facet>
                                #{prod.nombre}
                            </h:column>
                            <h:column>
                                <f:facet name="header">Precio</f:facet>
                                S/ #{prod.precio}
                            </h:column>
                            <h:column>
                                <f:facet name="header">Stock</f:facet>
                                <span class="badge bg-info text-dark">#{prod.stock} unid.</span>
                            </h:column>
                        </h:dataTable>
                    </div>
                </div>
            </div>
        </div>
    </div>
</h:body>
</f:view>
</html>
